services:
  dashboard:
    build: .
    restart: unless-stopped
    ports:
      - "8088:8080"
    environment:
      FLOCI_ENDPOINT_URL: http://floci:4566
      REPORTS_TABLE: service-reports
      REPORTS_BUCKET: vehicle-service-reports
      REPORTS_QUEUE_URL: http://floci:4566/000000000000/service-report-queue
      AWS_DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    networks:
      - floci

networks:
  floci:
    external: true
    name: floci_default
